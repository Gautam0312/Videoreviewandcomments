<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClientSide Video Review Tool</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; }
  body { margin:0; background:#f4f6f8; color:#222; }
  #app { width:100%; min-height:100vh; padding:16px 24px; }
  h1,h2,h3 { margin:0 0 10px 0; }
  button { cursor:pointer; border:none; border-radius:6px; padding:8px 14px; font-size:14px; background:#2563eb; color:#fff; }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  button.secondary { background:#6b7280; }
  button.danger { background:#dc2626; }
  button.success { background:#16a34a; }
  button.warn { background:#d97706; }
  input[type=text], textarea, input[type=file], select { padding:8px; border:1px solid #ccc; border-radius:6px; width:100%; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { padding:10px; border-bottom:1px solid #eee; text-align:left; font-size:14px; }
  th { background:#eef2f7; }
  .badge { padding:3px 10px; border-radius:12px; font-size:12px; color:#fff; }
  .b-pending_review{background:#64748b}.b-in_review{background:#2563eb}.b-reviewed{background:#0891b2}
  .b-in_fix{background:#d97706}.b-fixed{background:#7c3aed}.b-in_validation{background:#2563eb}
  .b-signed_off{background:#16a34a}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;background:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .layout{display:flex;gap:16px;align-items:flex-start}
  .video-col{flex:2;min-width:0}
  .comments-col{flex:1.3;min-width:380px;max-height:85vh;overflow:auto;background:#fff;border-radius:8px;padding:12px}
  video{width:100%;max-height:60vh;background:#000;border-radius:8px}
  .comment-card{border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:10px;background:#fafafa}
  .comment-card.resolved{background:#f0fdf4;border-color:#bbf7d0}
  .comment-text{font-size:16px;font-weight:600;color:#111;line-height:1.4;margin-bottom:8px}
  .comment-thumb-wrap{margin:6px 0}
  .comment-thumb-label{font-size:11px;color:#888;margin-bottom:3px}
  .comment-thumb{width:180px;max-width:100%;border-radius:6px;cursor:zoom-in;border:1px solid #ddd}
  .meta{font-size:12px;color:#666}
  .entry-box{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;background:#fff;padding:10px;border-radius:8px;border:1px solid #e5e7eb}
  .obs-card{background:#fff7ed;border:1px solid #f59e0b;border-radius:6px;padding:8px;margin-bottom:8px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;padding:20px;border-radius:8px;max-width:500px;width:90%}
  .lightbox-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;cursor:zoom-out}
  .lightbox-bg img{max-width:90%;max-height:90%;border-radius:8px}
  .center-card{max-width:480px;margin:60px auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .role-btn{flex:1;padding:16px;text-align:center;border:2px solid #ddd;border-radius:8px;cursor:pointer}
  .role-btn.active{border-color:#2563eb;background:#eff6ff}
  .toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:10px 16px;border-radius:6px;z-index:100;opacity:.95}
  .lockmsg{color:#b91c1c;font-weight:600}
  .small{font-size:12px;color:#666}
  .flexgap{display:flex;gap:8px;flex-wrap:wrap}
  .filter-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .filter-row > div{flex:1;min-width:160px}
  .resolved-section{margin-top:16px;background:#fff;border-radius:8px;padding:12px;border:1px solid #e5e7eb;max-height:300px;overflow:auto}
  .resolved-section h3{color:#166534}
  .flow-box{border:2px solid #2563eb;border-radius:8px;padding:10px 16px;background:#eff6ff;text-align:center;font-weight:600;min-width:200px}
  .flow-col{display:flex;flex-direction:column;align-items:center;gap:4px}
  .flow-arrow{font-size:22px;color:#2563eb}
  .flow-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;padding:20px;border-radius:8px;overflow-x:auto}
  .flow-note{font-size:12px;color:#666;max-width:220px;text-align:center}
  .perm-table td, .perm-table th{font-size:13px}
  .audit-row td{font-size:13px}
  .audit-action{font-weight:600;color:#1d4ed8}
  .url-link{color:#2563eb;text-decoration:underline;word-break:break-all;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="videoFileInput" accept="video/mp4" hidden>
<script>
/* ============== STATE ============== */
let state = { videos: [], __lastModified: null };
let fileHandle = null;
let useLocalStorageFallback = false;
let currentUser = { name:'', role:'' };
let screen = 'init';
let prevScreen = 'dashboard';
let activeVideoId = null;
let pendingObservations = [];
let scanAbort = false;
let recognition = null;
let activeCommentIndex = 0;

let videoSrcCache = {};
let videoTimeCache = {};
function cacheKey(v) { return v.id + '_r' + v.round; }

let statusFilters = { app:'', status:'', videoSearch:'' };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowStr = () => new Date().toLocaleString();

/* ============== AUDIT TRAIL HELPER ============== */
function logAudit(v, action, details) {
  if (!v.auditLog) v.auditLog = [];
  v.auditLog.push({
    id: uid(),
    at: nowStr(),
    by: currentUser.name || 'unknown',
    role: currentUser.role || 'unknown',
    action,
    details: details || ''
  });
}

/* ============== PERSISTENCE ============== */
async function pickFile(create) {
  try {
    if (create) {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: 'video-review-data.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      state = { videos: [], __lastModified: null };
      await saveState();
    } else {
      [fileHandle] = await window.showOpenFilePicker({
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      await loadState();
    }
    toast('Data file connected: ' + fileHandle.name);
  } catch (e) {
    if (e.name !== 'AbortError') {
      useLocalStorageFallback = true;
      toast('File System API unavailable — using browser local storage fallback');
      const saved = localStorage.getItem('vrt_data');
      state = saved ? JSON.parse(saved) : { videos: [], __lastModified: Date.now() };
    }
  }
}

async function loadState() {
  if (useLocalStorageFallback) {
    const saved = localStorage.getItem('vrt_data');
    if (saved) {
      try {
        state = JSON.parse(saved);
      } catch (e) {
        console.error('JSON parse error (localStorage):', e);
        toast('⚠️ Data appears corrupted — keeping last known good data in memory.');
      }
    }
    return;
  }
  if (!fileHandle) return;
  let file, text;
  try {
    file = await fileHandle.getFile();
    text = await file.text();
  } catch (e) {
    console.error('Error reading file:', e);
    toast('⚠️ Could not read the data file. Please check it is still accessible.');
    return;
  }
  try {
    const parsed = text ? JSON.parse(text) : { videos: [], __lastModified: null };
    state = parsed;
    state.__lastModified = file.lastModified;
  } catch (e) {
    console.error('JSON parse error (file):', e);
    toast('⚠️ Data file appears corrupted or incomplete — changes were not loaded. Please check the file.');
  }
}

async function saveState() {
  if (useLocalStorageFallback) {
    state.__lastModified = Date.now();
    localStorage.setItem('vrt_data', JSON.stringify(state));
    return;
  }
  if (!fileHandle) return;
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(state, null, 2));
  await writable.close();
  const file = await fileHandle.getFile();
  state.__lastModified = file.lastModified;
}

async function heartbeat() {
  let changed = false;
  if (useLocalStorageFallback) {
    const saved = localStorage.getItem('vrt_data');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed.__lastModified !== state.__lastModified) { state = parsed; changed = true; }
      } catch (e) {
        console.error('JSON parse error (heartbeat, localStorage):', e);
      }
    }
  } else if (fileHandle) {
    try {
      const file = await fileHandle.getFile();
      if (file.lastModified !== state.__lastModified) {
        const before = state.__lastModified;
        await loadState();
        if (state.__lastModified !== before) changed = true;
      }
    } catch (e) { /* ignore transient read errors */ }
  }
  if (!changed) return;
  toast('Synced latest changes from file');
  if (screen === 'review') { renderCommentsPanel(); renderResolvedPanel(); }
  else if (screen === 'fix') { renderFixPanel(); renderFixResolvedPanel(); }
  else render();
}
setInterval(heartbeat, 4000);

/* ============== UTIL ============== */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function findVideo(id) { return state.videos.find(v => v.id === id); }
function render() { screens[screen](); }
function fmtTime(t) {
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function openLightbox(src) {
  const bg = document.createElement('div');
  bg.className = 'lightbox-bg';
  bg.innerHTML = `<img src="${src}">`;
  bg.addEventListener('click', () => bg.remove());
  document.body.appendChild(bg);
}

/* ============== SCREENS ============== */
const screens = {};

screens.init = function () {
  document.getElementById('app').innerHTML = `
  <div class="center-card">
    <h2>Video Review Tool</h2>
    <p class="small">Select your role, enter your name, and open your shared data file.</p>
    <div class="flexgap" style="margin-bottom:16px">
      <div class="role-btn ${currentUser.role==='reviewer'?'active':''}" data-action="pickRole" data-id="reviewer">Reviewer</div>
      <div class="role-btn ${currentUser.role==='developer'?'active':''}" data-action="pickRole" data-id="developer">Developer</div>
    </div>
    <label>Your Name <span style="color:#dc2626">*</span></label>
    <input type="text" id="userName" value="${currentUser.name}" placeholder="e.g. Priya" required>
    <div style="margin:16px 0">
      <button class="secondary" style="width:100%" data-action="openDataFile">Open Existing Data File</button>
      <p class="small" style="margin-top:6px">First time setup? <a href="#" data-action="createDataFile">Create a new data file</a> instead.</p>
    </div>
    <p class="small">${fileHandle ? 'Connected: ' + fileHandle.name : (useLocalStorageFallback ? 'Using local-storage fallback' : 'No file connected yet')}</p>
    <button class="success" style="width:100%" data-action="enterApp" ${(!currentUser.role || !currentUser.name.trim() || (!fileHandle && !useLocalStorageFallback)) ? 'disabled' : ''}>Continue</button>
    <p class="small" style="text-align:center;margin-top:10px"><a href="#" data-action="openHowTo">How to use this tool</a></p>
  </div>`;
  document.getElementById('userName').addEventListener('input', (e) => {
    currentUser.name = e.target.value;
    const btn = document.querySelector('[data-action="enterApp"]');
    if (btn) btn.disabled = !currentUser.role || !e.target.value.trim() || (!fileHandle && !useLocalStorageFallback);
  });
};

screens.dashboard = function () {
  const showUrlColumn = currentUser.role === 'reviewer';
  const rows = state.videos.map(v => {
    const act = getAction(v);
    const canEditName = currentUser.role === 'developer' && v.addedBy === currentUser.name;
    return `<tr>
      <td>${v.appName || 'NA'}</td>
      <td>${v.name}</td>
      <td><span class="badge b-${v.status}">${v.status.replace('_',' ')}</span></td>
      <td>${v.round}</td>
      <td>${v.lock && v.lock.role ? `<span class="lockmsg">🔒 ${v.lock.role} (${v.lock.by})</span>` : '—'}</td>
      <td>${v.comments.length}</td>
      <td>${v.addedBy} / ${v.addedAt}</td>
      ${showUrlColumn ? `<td>${v.videoUrl ? `<a class="url-link" href="${v.videoUrl}" target="_blank" rel="noopener">${v.videoUrl}</a>` : 'NA'}</td>` : ''}
      <td class="flexgap">
        ${act.disabled ? `<button disabled>${act.label}</button>` : `<button data-action="${act.action}" data-id="${v.id}">${act.label}</button>`}
        <button class="secondary" data-action="openAuditTrail" data-id="${v.id}">Audit Trail</button>
        ${canEditName ? `<button class="secondary" data-action="openEditName" data-id="${v.id}">Edit Name</button>` : ''}
      </td>
    </tr>`;
  }).join('');
  document.getElementById('app').innerHTML = `
  <div class="topbar">
    <div><b>${currentUser.name}</b> — <span class="badge" style="background:#111">${currentUser.role}</span></div>
    <div class="flexgap">
      <button class="secondary" data-action="openHowTo">How to Use</button>
      <button class="secondary" data-action="openStatusDashboard">Status Overview</button>
      <button class="secondary" data-action="exportCsv">Export CSV</button>
      <button class="secondary" data-action="refreshNow">Refresh</button>
      <button class="danger" data-action="logout">Switch User/Role</button>
    </div>
  </div>
  <div style="background:#fff;padding:16px;border-radius:8px">
    <div class="flexgap" style="justify-content:space-between;margin-bottom:12px">
      <h2>Video Queue</h2>
      ${currentUser.role === 'developer' ? `<button data-action="openAddVideo">+ Add New Video</button>` : ''}
    </div>
    <table>
      <thead><tr>
        <th>Application</th><th>Name</th><th>Status</th><th>Round</th><th>Lock</th><th>#Comments</th><th>Added By</th>
        ${showUrlColumn ? '<th>Video URL</th>' : ''}
        <th>Action</th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan=${showUrlColumn ? 9 : 8}>No videos yet.</td></tr>`}</tbody>
    </table>
  </div>`;
};

/* ===== Status Overview with Filters ===== */
screens.statusDashboard = function () {
  const apps = [...new Set(state.videos.map(v => v.appName).filter(Boolean))];
  const statuses = [...new Set(state.videos.map(v => v.status))];

  let list = state.videos.slice();
  if (statusFilters.app) list = list.filter(v => v.appName === statusFilters.app);
  if (statusFilters.status) list = list.filter(v => v.status === statusFilters.status);
  if (statusFilters.videoSearch) list = list.filter(v => v.name.toLowerCase().includes(statusFilters.videoSearch.toLowerCase()));

  const rows = list.map(v => {
    const rounds = {};
    v.comments.forEach(c => {
      if (!rounds[c.round]) rounds[c.round] = { logged: 0, fixed: 0 };
      rounds[c.round].logged++;
      if (c.fixStatus === 'approved') rounds[c.round].fixed++;
    });
    const roundSummary = Object.keys(rounds).sort((a,b)=>a-b)
      .map(r => `R${r}: ${rounds[r].fixed}/${rounds[r].logged} fixed`).join('<br>') || 'No comments yet';
    const duration = v.durationSec ? fmtTime(v.durationSec) : '—';
    let withWhom;
    if (v.status === 'signed_off') withWhom = 'Signed Off ✅';
    else if (v.lock && v.lock.role) withWhom = `With ${v.lock.role} (${v.lock.by})`;
    else if (v.status === 'pending_review') withWhom = 'With Reviewer (not started)';
    else if (v.status === 'reviewed') withWhom = 'With Developer (not started)';
    else if (v.status === 'fixed') withWhom = 'With Reviewer (not started)';
    else withWhom = '—';
    return `<tr>
      <td>${v.appName || '—'}</td>
      <td>${v.name}</td>
      <td>${duration}</td>
      <td>${roundSummary}</td>
      <td><span class="badge b-${v.status}">${v.status.replace('_',' ')}</span><br><span class="small">${withWhom}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="topbar">
    <div><b>Status Overview</b> — ${currentUser.name} (${currentUser.role})</div>
    <div class="flexgap">
      <button class="secondary" data-action="openHowTo">How to Use</button>
      <button class="secondary" data-action="backToDashboard">Back to Queue</button>
    </div>
  </div>
  <div style="background:#fff;padding:16px;border-radius:8px">
    <div class="filter-row">
      <div>
        <label class="small">Application</label>
        <select id="filterApp">
          <option value="">All</option>
          ${apps.map(a => `<option value="${a}" ${statusFilters.app===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="small">Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          ${statuses.map(s => `<option value="${s}" ${statusFilters.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="small">Video Name Search</label>
        <input type="text" id="filterVideo" value="${statusFilters.videoSearch}" placeholder="Search video name...">
      </div>
      <div style="flex:0 0 auto;align-self:flex-end">
        <button class="secondary" data-action="clearStatusFilters">Clear Filters</button>
      </div>
    </div>
    <table>
      <thead><tr><th>Application</th><th>Video</th><th>Duration</th><th>Issues Logged vs Fixed (by round)</th><th>Current Status</th></tr></thead>
      <tbody>${rows || '<tr><td colspan=5>No matching videos.</td></tr>'}</tbody>
    </table>
  </div>`;

  document.getElementById('filterApp').addEventListener('change', (e) => { statusFilters.app = e.target.value; screens.statusDashboard(); });
  document.getElementById('filterStatus').addEventListener('change', (e) => { statusFilters.status = e.target.value; screens.statusDashboard(); });
  document.getElementById('filterVideo').addEventListener('input', (e) => { statusFilters.videoSearch = e.target.value; screens.statusDashboard(); });
};

/* ===== How To Use Page ===== */
screens.howto = function () {
  document.getElementById('app').innerHTML = `
  <div class="topbar">
    <div><b>How to Use This Tool</b></div>
    <button class="secondary" data-action="backFromHowTo">Back</button>
  </div>

  <div style="background:#fff;padding:20px;border-radius:8px;margin-bottom:16px">
    <h2>Overview</h2>
    <p>This tool helps Reviewers and Developers collaborate on fixing issues found in review videos, entirely from your browser — no server required. All data (comments, statuses, locks, audit history) is stored in a shared JSON data file that both roles open, and the tool auto-syncs changes using a heartbeat check every few seconds.</p>

    <h3>Getting Started</h3>
    <ol>
      <li>On the launch screen, choose your role: <b>Reviewer</b> or <b>Developer</b>.</li>
      <li>Enter your name (required).</li>
      <li>Open the shared data file (JSON), or create a new one on first-time setup.</li>
      <li>Click Continue to reach your Dashboard / Video Queue.</li>
    </ol>

    <h3>Developer: Adding a Video</h3>
    <p>Developers add a new video entry (Application Name + Video Name + optional Video URL) to the queue once it's ready for review. The developer who created an entry can later rename it using the "Edit Name" button in the Video Queue.</p>

    <h3>Reviewer: Logging Issues (Round 1)</h3>
    <ol>
      <li>Click "Start Review" — locks the entry for you exclusively.</li>
      <li>Browse and select the local MP4 file, or let the tool auto-load from the Video URL if one was provided. The Video URL (if provided) is also shown in the Video Queue and on this screen as a clickable link you can open in a new tab.</li>
      <li>Optionally click "Auto Review for URLs" to scan for on-screen URLs. Accept or reject each one.</li>
      <li>Add comments by typing or using the 🎤 mic button. Clicking into the comment box auto-pauses the video. The field clears automatically after adding.</li>
      <li>Click "Review Complete" when done.</li>
    </ol>

    <h3>Developer: Fixing Issues</h3>
    <ol>
      <li>Click "Start Fix" — locks the entry for you.</li>
      <li>Mark each comment "Addressed" or "Can't Fix".</li>
      <li>Once all comments are marked, click "All Fixes Completed" — confirm the SharePoint upload, and optionally enter/update the URL to fetch the latest MP4. This releases the lock and sends it back to the Reviewer.</li>
    </ol>

    <h3>Reviewer: Validation Rounds</h3>
    <ol>
      <li>Click "Start Validation Rx" — increments the round and locks the video for you.</li>
      <li>Browse the updated video, or let it auto-load from the latest Video URL if the developer provided one.</li>
      <li>Approve fixes or add follow-ups. Add new comments if needed.</li>
      <li>Click "Review Complete" — if everything is approved, the video is Signed Off; otherwise it returns to the Developer.</li>
    </ol>

    <h3>Rollback</h3>
    <p>Only the Reviewer can roll back a Signed Off video to the Fix stage. This starts a new round automatically.</p>

    <h3>Video URL (Fetch Latest MP4)</h3>
    <p>Developers can optionally provide a URL pointing to the latest MP4 file — when creating a new video entry, and again whenever all fixes are completed. Reviewers can see this URL in the Video Queue and on the Review screen as a clickable link, and the Review/Fix screens will also try to auto-load the video from it; "Browse Video File" always remains available as an alternative.</p>

    <h3>Deleting Comments</h3>
    <p>Deleting a comment now asks for confirmation first, since this action cannot be undone.</p>
  </div>

  <div class="flow-wrap">
    <h3>Review Lifecycle Flowchart</h3>
    <div class="flow-col">
      <div class="flow-box">Developer adds Video<br><span class="small">(Pending Review)</span></div>
      <div class="flow-arrow">↓</div>
      <div class="flow-box" style="border-color:#16a34a;background:#f0fdf4">Reviewer: Start Review<br><span class="small">🔒 Locked for Reviewer</span></div>
      <div class="flow-note">Browse/auto-load video, auto-scan URLs, log comments</div>
      <div class="flow-arrow">↓</div>
      <div class="flow-box">Reviewer: Review Complete</div>
      <div class="flow-arrow">↓</div>
      <div class="flow-box" style="border-color:#d97706;background:#fffbeb">Developer: Start Fix<br><span class="small">🔒 Locked for Developer</span></div>
      <div class="flow-note">Mark each comment Addressed / Can't Fix</div>
      <div class="flow-arrow">↓</div>
      <div class="flow-box">Developer: All Fixes Completed<br><span class="small">(Confirm upload + optional video URL)</span></div>
      <div class="flow-arrow">↓</div>
      <div class="flow-box" style="border-color:#16a34a;background:#f0fdf4">Reviewer: Start Validation (Round+1)</div>
      <div class="flow-arrow">↓</div>
      <div class="flow-box">Reviewer: Review Complete</div>
      <div class="flow-arrow">↓</div>
      <div style="display:flex;gap:40px;align-items:flex-start">
        <div class="flow-col">
          <div class="flow-box" style="border-color:#16a34a;background:#dcfce7">All approved →<br>SIGNED OFF ✅</div>
        </div>
        <div class="flow-col">

function getAction(v) {
  const role = currentUser.role;
  const mine = v.lock && v.lock.by === currentUser.name && v.lock.role === role;
  switch (v.status) {
    case 'pending_review':
      return role === 'reviewer' ? { label: 'Start Review', action: 'startReview' } : { label: 'Waiting for Reviewer', disabled: true };
    case 'in_review':
      if (role === 'reviewer' && mine) return { label: 'Continue Review', action: 'openReview' };
      return { label: 'Locked by Reviewer', disabled: true };
    case 'reviewed':
      return role === 'developer' ? { label: 'Start Fix', action: 'startFix' } : { label: 'Waiting for Developer', disabled: true };
    case 'in_fix':
      if (role === 'developer' && mine) return { label: 'Continue Fix', action: 'openFix' };
      return { label: 'Locked by Developer', disabled: true };
    case 'fixed':
      return role === 'reviewer' ? { label: `Start Validation R${v.round + 1}`, action: 'startValidation' } : { label: 'Waiting for Reviewer', disabled: true };
    case 'in_validation':
      if (role === 'reviewer' && mine) return { label: 'Continue Validation', action: 'openReview' };
      return { label: 'Locked by Reviewer (validating)', disabled: true };
    case 'signed_off':
      return { label: role === 'reviewer' ? 'View / Rollback' : 'Signed Off (view only)', action: 'openSignedOff' };
  }
}

function attachVideoHandlers() {
  const video = document.getElementById('reviewVideo');
  if (!video) return;
  const v = findVideo(activeVideoId);
  if (v) {
    const key = cacheKey(v);
    if (!video.hasAttribute('src') && videoSrcCache[key]) {
      video.src = videoSrcCache[key];
    } else if (!video.hasAttribute('src') && v.videoUrl) {
      video.src = v.videoUrl;
    }
    video.addEventListener('loadedmetadata', () => {
      if (!v.durationSec) { v.durationSec = video.duration; saveState(); }
      const t = videoTimeCache[key];
      if (t) video.currentTime = t;
    });
    video.addEventListener('timeupdate', () => { videoTimeCache[key] = video.currentTime; });
  }
}

  },
  openAddVideo() {

    <div class="modal-bg" id="modal"><div class="modal">
      <h3>Add New Video Entry</h3>
      <label>Application Name</label>

      <p class="small" style="margin-top:4px">If provided, this URL will be shown to the Reviewer in the Video Queue and on the Review screen, and the tool will try to auto-load it. "Browse Video File" always remains available too.</p>
      <div class="flexgap" style="margin-top:12px"><button data-action="saveNewVideo">Save</button><button class="secondary" data-action="closeModal">Cancel</button></div>

    const videoUrl = document.getElementById('newVideoUrl').value.trim();
    if (!name) return;

    const newVideo = { id: uid(), appName, name, status:'pending_review', round:1, lock:null, addedBy: currentUser.name, addedAt: nowStr(), comments:[], durationSec:null, auditLog:[], videoUrl: videoUrl || '' };
    logAudit(newVideo, 'Video Created', `App: ${appName || 'N/A'}${videoUrl ? ', Video URL provided' : ''}`);
    state.videos.push(newVideo);
    await saveState();
    actions.closeModal();

  },

  /* ===== NEW: Edit Name (developer who created the entry only) ===== */
  openEditName(el, id) {
    const v = findVideo(id);
    if (!v) return;
    document.getElementById('app').insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="editNameModal"><div class="modal">
      <h3>Edit Video Name</h3>

      </div>

  },
  closeEditNameModal() { document.getElementById('editNameModal')?.remove(); },
  async saveEditedName(el, id) {
    const v = findVideo(id);
    if (!v) return;
    const newName = document.getElementById('editVideoNameInput').value.trim();
    if (!newName) { toast('Name cannot be empty'); return; }

    }

    v.name = newName;
    logAudit(v, 'Video Renamed', `"${oldName}" → "${newName}"`);

  async startReview(el, id) {
    await loadState();
    const v = findVideo(id);
    if (v.lock && v.lock.role && !(v.lock.by === currentUser.name && v.lock.role === 'reviewer')) { toast('Locked by someone else'); render(); return; }
    v.status = 'in_review';
    v.lock = { role:'reviewer', by: currentUser.name, at: nowStr() };
    logAudit(v, 'Lock Acquired', `Reviewer started Round ${v.round} review`);
    logAudit(v, 'Status Change', `pending_review → in_review`);
    await saveState();
    activeVideoId = id; screen = 'review'; render();
  },
  openReview(el, id) { activeVideoId = id; screen = 'review'; render(); },
  async startFix(el, id) {
    await loadState();
    const v = findVideo(id);
    if (v.lock && v.lock.role && !(v.lock.by === currentUser.name && v.lock.role === 'developer')) { toast('Locked by someone else'); render(); return; }
    v.status = 'in_fix';
    v.lock = { role:'developer', by: currentUser.name, at: nowStr() };
    logAudit(v, 'Lock Acquired', `Developer started fixing Round ${v.round}`);
    logAudit(v, 'Status Change', `reviewed → in_fix`);
    await saveState();
    activeVideoId = id; screen = 'fix'; render();
  },
  openFix(el, id) { activeVideoId = id; screen = 'fix'; render(); },
  async startValidation(el, id) {
    await loadState();
    const v = findVideo(id);
    if (v.lock && v.lock.role && !(v.lock.by === currentUser.name && v.lock.role === 'reviewer')) { toast('Locked by someone else'); render(); return; }
    const prevRound = v.round;
    v.status = 'in_validation';
    v.round += 1;
    v.lock = { role:'reviewer', by: currentUser.name, at: nowStr() };
    logAudit(v, 'Lock Acquired', `Reviewer started validation`);
    logAudit(v, 'Round Incremented', `R${prevRound} → R${v.round}`);
    logAudit(v, 'Status Change', `fixed → in_validation`);
    await saveState();
    activeVideoId = id; screen = 'review'; render();
  },
  openSignedOff(el, id) { activeVideoId = id; screen = 'signedoff'; render(); },
  backToDashboard() { screen = 'dashboard'; render(); },

  browseVideo() {
    const input = document.getElementById('videoFileInput');
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      const video = document.getElementById('reviewVideo');
      const url = URL.createObjectURL(file);
      video.src = url;
      const v = findVideo(activeVideoId);
      if (v) videoSrcCache[cacheKey(v)] = url;
    };
    input.click();
  },

  toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Speech recognition not supported in this browser'); return; }
    const btn = document.getElementById('micBtn');
    if (recognition) { recognition.stop(); recognition = null; btn.textContent = '🎤'; return; }
    const video = document.getElementById('reviewVideo');
    if (video && !video.paused) video.pause();
    recognition = new SR();
    recognition.continuous = true; recognition.interimResults = false;
    recognition.onresult = (e) => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript + ' ';
      const ta = document.getElementById('commentText');
      if (ta) ta.value += text;
    };
    recognition.onend = () => { const b = document.getElementById('micBtn'); if (b) b.textContent = '🎤'; recognition = null; };
    recognition.start();
    btn.textContent = '⏹';
  },

  async submitComment() {
    const video = document.getElementById('reviewVideo');
    const textEl = document.getElementById('commentText');
    const text = textEl.value.trim();
    if (!text) { toast('Enter a comment'); return; }
    if (!video.src) { toast('Browse a video first'); return; }
    const v = findVideo(activeVideoId);
    const currentTimeAtSubmit = video.currentTime;
    const canvas = document.createElement('canvas');
    const MAX_W = 1280;
    canvas.width = Math.min(video.videoWidth || MAX_W, MAX_W);
    canvas.height = canvas.width * (video.videoHeight / video.videoWidth);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const screenshotDataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const commentType = recognition ? 'voice' : 'text';
    v.comments.push({
      id: uid(), time: currentTimeAtSubmit, screenshot: screenshotDataUrl,
      text, type: commentType, source:'manual',
      loggedBy: currentUser.name, loggedAt: nowStr(), round: v.round,
      devStatus: null, devNote:'', fixStatus: null, followupText:''
    });
    logAudit(v, 'Comment Added', `[${commentType}] at ${fmtTime(currentTimeAtSubmit)}: "${text.slice(0,80)}${text.length>80?'...':''}"`);
    textEl.value = '';
    await saveState();
    renderCommentsPanel();
    renderResolvedPanel();
  },

  seekTo(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    const video = document.getElementById('reviewVideo');
    if (video && c) video.currentTime = c.time;
  },

  viewScreenshot(el) {
    openLightbox(el.dataset.src);
  },

  async deleteComment(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    if (!c) return;
    const preview = c.text.length > 100 ? c.text.slice(0, 100) + '...' : c.text;
    const confirmDelete = confirm(`Are you sure you want to delete this comment?\n\n"${preview}"\n\nThis action cannot be undone.`);
    if (!confirmDelete) return;
    logAudit(v, 'Comment Deleted', `at ${fmtTime(c.time)}: "${preview}"`);
    v.comments = v.comments.filter(c => c.id !== id);
    await saveState();
    renderCommentsPanel();
    renderResolvedPanel();
  },

  async reviewComplete() {
    const v = findVideo(activeVideoId);
    if (v.status === 'in_review') {
      v.status = 'reviewed'; v.lock = null;
      logAudit(v, 'Lock Released', 'Reviewer submitted Round 1 review');
      logAudit(v, 'Status Change', 'in_review → reviewed');
      await saveState();
      toast('Review submitted. Locked released for developer.');
    } else if (v.status === 'in_validation') {
      const open = v.comments.filter(c => c.fixStatus !== 'approved');
      if (open.length === 0) {
        v.status = 'signed_off'; v.lock = { role:'locked', by:'system', at: nowStr() };
        logAudit(v, 'Status Change', 'in_validation → signed_off');
        logAudit(v, 'Video Signed Off', `All comments approved in Round ${v.round}`);
        toast('All fixes approved — Video Signed Off!');
      } else {
        v.status = 'reviewed'; v.lock = null;
        logAudit(v, 'Lock Released', `Reviewer submitted validation Round ${v.round}, ${open.length} item(s) still open`);
        logAudit(v, 'Status Change', 'in_validation → reviewed');
        toast('Some items still open — sent back to developer.');
      }
      await saveState();
    }
    screen = 'dashboard'; render();
  },

  async markAddressed(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    c.devStatus = 'addressed';
    logAudit(v, 'Comment Addressed', `at ${fmtTime(c.time)}: "${c.text.slice(0,80)}${c.text.length>80?'...':''}"`);
    await saveState();
    renderFixPanel();
    renderFixResolvedPanel();
  },
  async markNotAddressed(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    c.devStatus = 'not-addressed';
    c.devNote = prompt('Reason / note:', c.devNote || '') || '';
    logAudit(v, "Comment Marked Can't Fix", `at ${fmtTime(c.time)} — Note: "${c.devNote}"`);
    await saveState();
    renderFixPanel();
    renderFixResolvedPanel();
  },
  async allFixesComplete() {
    const v = findVideo(activeVideoId);
    const pending = v.comments.filter(c => !c.devStatus);
    if (pending.length) { toast('Please mark all comments before completing.'); return; }
    const confirmUpload = confirm('Confirm: Have you uploaded the latest MP4 file to SharePoint?');
    if (confirmUpload) {
      const newUrl = prompt('Enter the URL to fetch the latest MP4 (optional — leave blank to keep existing):', v.videoUrl || '');
      if (newUrl !== null && newUrl.trim() !== '') {
        v.videoUrl = newUrl.trim();
        logAudit(v, 'Video URL Updated', `New URL provided for Round ${v.round} fixed video`);
      }
      v.status = 'fixed'; v.lock = null;
      logAudit(v, 'Lock Released', `Developer completed all fixes for Round ${v.round}`);
      logAudit(v, 'Status Change', 'in_fix → fixed');
      logAudit(v, 'SharePoint Upload Confirmed', '');
      await saveState();
      toast('Marked fixed and uploaded. Sent to reviewer.');
      screen = 'dashboard'; render();
    }
  },

  async approveFix(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    c.fixStatus = 'approved';
    logAudit(v, 'Fix Approved', `at ${fmtTime(c.time)}: "${c.text.slice(0,80)}${c.text.length>80?'...':''}"`);
    await saveState();
    renderCommentsPanel();
    renderResolvedPanel();
  },
  async followup(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    const txt = prompt('Follow-up note:');
    if (txt) {
      c.fixStatus = 'followup'; c.followupText = txt; c.devStatus = null;
      logAudit(v, 'Follow-up Added', `at ${fmtTime(c.time)} — Note: "${txt}"`);
    }
    await saveState();
    renderCommentsPanel();
    renderResolvedPanel();
  },
  async markAllFixed() {
    const v = findVideo(activeVideoId);
    let count = 0;
    v.comments.forEach(c => { if (c.devStatus === 'addressed' && c.fixStatus !== 'approved') { c.fixStatus = 'approved'; count++; } });
    if (count > 0) logAudit(v, 'Bulk Approve', `${count} addressed comment(s) marked approved`);
    await saveState();
    renderCommentsPanel();
    renderResolvedPanel();
  },
  prevComment() {
    const v = findVideo(activeVideoId);
    if (!v.comments.length) return;
    activeCommentIndex = (activeCommentIndex - 1 + v.comments.length) % v.comments.length;
    const c = v.comments[activeCommentIndex];
    document.getElementById('reviewVideo').currentTime = c.time;
    document.getElementById('cmt_' + c.id)?.scrollIntoView({behavior:'smooth'});
  },
  nextComment() {
    const v = findVideo(activeVideoId);
    if (!v.comments.length) return;
    activeCommentIndex = (activeCommentIndex + 1) % v.comments.length;
    const c = v.comments[activeCommentIndex];
    document.getElementById('reviewVideo').currentTime = c.time;
    document.getElementById('cmt_' + c.id)?.scrollIntoView({behavior:'smooth'});
  },

  async rollback() {
    const v = findVideo(activeVideoId);
    const prevRound = v.round;
    v.round += 1;
    v.status = 'fixed'; v.lock = null;
    logAudit(v, 'Rollback', `Reviewer rolled back from Signed Off. Round ${prevRound} → ${v.round}`);
    logAudit(v, 'Status Change', 'signed_off → fixed');
    await saveState();
    toast('Rolled back to Fix stage. New round started: R' + v.round);
    screen = 'dashboard'; render();
  },

  /* ---- Auto URL scan using Tesseract.js ---- */
  async autoScanUrls() {
    const video = document.getElementById('reviewVideo');
    if (!video.src) { toast('Browse a video first'); return; }
    if (!video.duration || isNaN(video.duration)) { toast('Video not ready yet'); return; }
    pendingObservations = [];
    scanAbort = false;
    const progressEl = document.getElementById('scanProgress');
    const duration = video.duration;
    for (let t = 0; t < duration && !scanAbort; t += 5) {
      progressEl.textContent = `Scanning ${fmtTime(t)} / ${fmtTime(duration)}...`;
      await seekVideo(video, t);
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const regions = cornerRegions(canvas);
      for (const r of regions) {
        try {
          const { data: { text } } = await Tesseract.recognize(r.canvas, 'eng');
          const urls = extractUrls(text);
          if (urls.length) {
            pendingObservations.push({ id: uid(), time: t, corner: r.label, text: urls.join(', '), screenshot: canvas.toDataURL('image/jpeg', 0.92) });
          }
        } catch (e) { /* ignore OCR error for this region */ }
      }
      renderObservations();
    }
    progressEl.textContent = `Scan complete. ${pendingObservations.length} observation(s) found.`;
  },

  acceptObs(el, id) {
    const obs = pendingObservations.find(o => o.id === id);
    const v = findVideo(activeVideoId);
    v.comments.push({
      id: uid(), time: obs.time, screenshot: obs.screenshot, text: `URL detected (${obs.corner}): ${obs.text}`,
      type:'text', source:'url-auto', loggedBy: currentUser.name, loggedAt: nowStr(), round: v.round,
      devStatus: null, devNote:'', fixStatus: null, followupText:''
    });
    logAudit(v, 'Comment Added', `[auto-url] at ${fmtTime(obs.time)}: ${obs.corner} — ${obs.text}`);
    pendingObservations = pendingObservations.filter(o => o.id !== id);
    saveState().then(() => { renderObservations(); renderCommentsPanel(); renderResolvedPanel(); });
  },
  rejectObs(el, id) {
    pendingObservations = pendingObservations.filter(o => o.id !== id);
    renderObservations();
  }
};

function seekVideo(video, t) {
  return new Promise(res => {
    const onSeek = () => { video.removeEventListener('seeked', onSeek); res(); };
    video.addEventListener('seeked', onSeek);
    video.currentTime = t;
  });
}
function cornerRegions(canvas) {
  const w = canvas.width, h = canvas.height;
  const cw = Math.floor(w * 0.28), ch = Math.floor(h * 0.28);
  const coords = [['TopLeft',0,0], ['TopRight', w - cw, 0], ['BottomLeft', 0, h - ch], ['BottomRight', w - cw, h - ch]];
  return coords.map(([label, x, y]) => {
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    c.getContext('2d').drawImage(canvas, x, y, cw, ch, 0, 0, cw, ch);
    return { label, canvas: c };
  });
}
function extractUrls(text) {
  const re = /((https?:\/\/|www\.)[^\s]+|[a-zA-Z0-9-]+\.(com|org|net|io|gov|edu)[^\s]*)/gi;
  return text.match(re) || [];
}
function renderObservations() {
  const area = document.getElementById('obsArea');
  if (!area) return;
  area.innerHTML = pendingObservations.map(o => `
    <div class="obs-card">
      <div class="meta">⏱ ${fmtTime(o.time)} — ${o.corner}</div>
      <div><b>${o.text}</b></div>
      <img src="${o.screenshot}" style="width:150px;border-radius:4px">
      <div class="flexgap"><button class="success" data-action="acceptObs" data-id="${o.id}">Accept</button><button class="danger" data-action="rejectObs" data-id="${o.id}">Reject</button></div>
    </div>`).join('');
}

/* ============== EVENT DELEGATION ============== */
document.getElementById('app').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const fn = actions[el.dataset.action];
  if (fn) fn(el, el.dataset.id, e);
});

/* ============== INIT ============== */
render();
</script>
</body>
