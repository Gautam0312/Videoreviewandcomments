                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClientSide Video Review Tool</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; }
  body { margin:0; background:#f4f6f8; color:#222; }
  #app { width:100%; min-height:100vh; padding:16px 24px; }
  h1,h2,h3 { margin:0 0 10px 0; }
  button { cursor:pointer; border:none; border-radius:6px; padding:8px 14px; font-size:14px; background:#2563eb; color:#fff; }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  button.secondary { background:#6b7280; }
  button.danger { background:#dc2626; }
  button.success { background:#16a34a; }
  button.warn { background:#d97706; }
  input[type=text], textarea, input[type=file], select { padding:8px; border:1px solid #ccc; border-radius:6px; width:100%; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { padding:10px; border-bottom:1px solid #eee; text-align:left; font-size:14px; }
  th { background:#eef2f7; }
  .badge { padding:3px 10px; border-radius:12px; font-size:12px; color:#fff; }
  .b-pending_review{background:#64748b}.b-in_review{background:#2563eb}.b-reviewed{background:#0891b2}
  .b-in_fix{background:#d97706}.b-fixed{background:#7c3aed}.b-in_validation{background:#2563eb}
  .b-signed_off{background:#16a34a}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;background:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .layout{display:flex;gap:16px;align-items:flex-start}
  .video-col{flex:2;min-width:0}
  .comments-col{flex:1.3;min-width:380px;max-height:85vh;overflow:auto;background:#fff;border-radius:8px;padding:12px}
  video{width:100%;max-height:60vh;background:#000;border-radius:8px}
  .comment-card{border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:10px;background:#fafafa}
  .comment-card img{width:100%;border-radius:6px;margin:6px 0}
  .meta{font-size:12px;color:#666}
  .entry-box{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;background:#fff;padding:10px;border-radius:8px;border:1px solid #e5e7eb}
  .obs-card{background:#fff7ed;border:1px solid #f59e0b;border-radius:6px;padding:8px;margin-bottom:8px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;padding:20px;border-radius:8px;max-width:500px;width:90%}
  .center-card{max-width:480px;margin:60px auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .role-btn{flex:1;padding:16px;text-align:center;border:2px solid #ddd;border-radius:8px;cursor:pointer}
  .role-btn.active{border-color:#2563eb;background:#eff6ff}
  .toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:10px 16px;border-radius:6px;z-index:100;opacity:.95}
  .lockmsg{color:#b91c1c;font-weight:600}
  .small{font-size:12px;color:#666}
  .flexgap{display:flex;gap:8px;flex-wrap:wrap}
  .filter-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .filter-row > div{flex:1;min-width:160px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="videoFileInput" accept="video/mp4" hidden>
<script>
/* ============== STATE ============== */
let state = { videos: [], __lastModified: null };
let fileHandle = null;
let useLocalStorageFallback = false;
let currentUser = { name:'', role:'' };
let screen = 'init';
let activeVideoId = null;
let pendingObservations = [];
let scanAbort = false;
let recognition = null;
let activeCommentIndex = 0;

let videoSrcCache = {};
let videoTimeCache = {};
function cacheKey(v) { return v.id + '_r' + v.round; }

let statusFilters = { app:'', status:'', videoSearch:'' };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowStr = () => new Date().toLocaleString();

/* ============== PERSISTENCE ============== */
async function pickFile(create) {
  try {
    if (create) {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: 'video-review-data.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      state = { videos: [], __lastModified: null };
      await saveState();
    } else {
      [fileHandle] = await window.showOpenFilePicker({
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      await loadState();
    }
    toast('Data file connected: ' + fileHandle.name);
  } catch (e) {
    if (e.name !== 'AbortError') {
      useLocalStorageFallback = true;
      toast('File System API unavailable — using browser local storage fallback');
      const saved = localStorage.getItem('vrt_data');
      state = saved ? JSON.parse(saved) : { videos: [], __lastModified: Date.now() };
    }
  }
}

async function loadState() {
  if (useLocalStorageFallback) {
    const saved = localStorage.getItem('vrt_data');
    if (saved) state = JSON.parse(saved);
    return;
  }
  if (!fileHandle) return;
  const file = await fileHandle.getFile();
  const text = await file.text();
  state = text ? JSON.parse(text) : { videos: [], __lastModified: null };
  state.__lastModified = file.lastModified;
}

async function saveState() {
  if (useLocalStorageFallback) {
    state.__lastModified = Date.now();
    localStorage.setItem('vrt_data', JSON.stringify(state));
    return;
  }
  if (!fileHandle) return;
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(state, null, 2));
  await writable.close();
  const file = await fileHandle.getFile();
  state.__lastModified = file.lastModified;
}

async function heartbeat() {
  let changed = false;
  if (useLocalStorageFallback) {
    const saved = localStorage.getItem('vrt_data');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.__lastModified !== state.__lastModified) { state = parsed; changed = true; }
    }
  } else if (fileHandle) {
    try {
      const file = await fileHandle.getFile();
      if (file.lastModified !== state.__lastModified) { await loadState(); changed = true; }
    } catch (e) { /* ignore */ }
  }
  if (!changed) return;
  toast('Synced latest changes from file');
  /* IMPORTANT: avoid full shell re-render on review/fix screens so the loaded video is not disturbed */
  if (screen === 'review') renderCommentsPanel();
  else if (screen === 'fix') renderFixPanel();
  else render();
}
setInterval(heartbeat, 4000);

/* ============== UTIL ============== */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function findVideo(id) { return state.videos.find(v => v.id === id); }
function render() { screens[screen](); }
function fmtTime(t) {
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

/* ============== SCREENS ============== */
const screens = {};

screens.init = function () {
  document.getElementById('app').innerHTML = `
  <div class="center-card">
    <h2>Video Review Tool</h2>
    <p class="small">Select your role, enter your name, and open your shared data file.</p>
    <div class="flexgap" style="margin-bottom:16px">
      <div class="role-btn ${currentUser.role==='reviewer'?'active':''}" data-action="pickRole" data-id="reviewer">Reviewer</div>
      <div class="role-btn ${currentUser.role==='developer'?'active':''}" data-action="pickRole" data-id="developer">Developer</div>
    </div>
    <label>Your Name <span style="color:#dc2626">*</span></label>
    <input type="text" id="userName" value="${currentUser.name}" placeholder="e.g. Priya" required>
    <div style="margin:16px 0">
      <button class="secondary" style="width:100%" data-action="openDataFile">Open Existing Data File</button>
      <p class="small" style="margin-top:6px">First time setup? <a href="#" data-action="createDataFile">Create a new data file</a> instead.</p>
    </div>
    <p class="small">${fileHandle ? 'Connected: ' + fileHandle.name : (useLocalStorageFallback ? 'Using local-storage fallback' : 'No file connected yet')}</p>
    <button class="success" style="width:100%" data-action="enterApp" ${(!currentUser.role || !currentUser.name.trim() || (!fileHandle && !useLocalStorageFallback)) ? 'disabled' : ''}>Continue</button>
  </div>`;
  document.getElementById('userName').addEventListener('input', (e) => {
    currentUser.name = e.target.value;
    const btn = document.querySelector('[data-action="enterApp"]');
    if (btn) btn.disabled = !currentUser.role || !e.target.value.trim() || (!fileHandle && !useLocalStorageFallback);
  });
};

screens.dashboard = function () {
  const rows = state.videos.map(v => {
    const act = getAction(v);
    return `<tr>
      <td>${v.name}</td>
      <td><span class="badge b-${v.status}">${v.status.replace('_',' ')}</span></td>
      <td>${v.round}</td>
      <td>${v.lock && v.lock.role ? `<span class="lockmsg">🔒 ${v.lock.role} (${v.lock.by})</span>` : '—'}</td>
      <td>${v.comments.length}</td>
      <td>${v.addedBy} / ${v.addedAt}</td>
      <td>${act.disabled ? `<button disabled>${act.label}</button>` : `<button data-action="${act.action}" data-id="${v.id}">${act.label}</button>`}</td>
    </tr>`;
  }).join('');
  document.getElementById('app').innerHTML = `
  <div class="topbar">
    <div><b>${currentUser.name}</b> — <span class="badge" style="background:#111">${currentUser.role}</span></div>
    <div class="flexgap">
      <button class="secondary" data-action="openStatusDashboard">Status Overview</button>
      <button class="secondary" data-action="exportCsv">Export CSV</button>
      <button class="secondary" data-action="refreshNow">Refresh</button>
      <button class="danger" data-action="logout">Switch User/Role</button>
    </div>
  </div>
  <div style="background:#fff;padding:16px;border-radius:8px">
    <div class="flexgap" style="justify-content:space-between;margin-bottom:12px">
      <h2>Video Queue</h2>
      ${currentUser.role === 'developer' ? `<button data-action="openAddVideo">+ Add New Video</button>` : ''}
    </div>
    <table>
      <thead><tr><th>Name</th><th>Status</th><th>Round</th><th>Lock</th><th>#Comments</th><th>Added By</th><th>Action</th></tr></thead>
      <tbody>${rows || '<tr><td colspan=7>No videos yet.</td></tr>'}</tbody>
    </table>
  </div>`;
};

/* ===== Status Overview with Filters ===== */
screens.statusDashboard = function () {
  const apps = [...new Set(state.videos.map(v => v.appName).filter(Boolean))];
  const statuses = [...new Set(state.videos.map(v => v.status))];

  let list = state.videos.slice();
  if (statusFilters.app) list = list.filter(v => v.appName === statusFilters.app);
  if (statusFilters.status) list = list.filter(v => v.status === statusFilters.status);
  if (statusFilters.videoSearch) list = list.filter(v => v.name.toLowerCase().includes(statusFilters.videoSearch.toLowerCase()));

  const rows = list.map(v => {
    const rounds = {};
    v.comments.forEach(c => {
      if (!rounds[c.round]) rounds[c.round] = { logged: 0, fixed: 0 };
      rounds[c.round].logged++;
      if (c.fixStatus === 'approved') rounds[c.round].fixed++;
    });
    const roundSummary = Object.keys(rounds).sort((a,b)=>a-b)
      .map(r => `R${r}: ${rounds[r].fixed}/${rounds[r].logged} fixed`).join('<br>') || 'No comments yet';
    const duration = v.durationSec ? fmtTime(v.durationSec) : '—';
    let withWhom;
    if (v.status === 'signed_off') withWhom = 'Signed Off ✅';
    else if (v.lock && v.lock.role) withWhom = `With ${v.lock.role} (${v.lock.by})`;
    else if (v.status === 'pending_review') withWhom = 'With Reviewer (not started)';
    else if (v.status === 'reviewed') withWhom = 'With Developer (not started)';
    else if (v.status === 'fixed') withWhom = 'With Reviewer (not started)';
    else withWhom = '—';
    return `<tr>
      <td>${v.appName || '—'}</td>
      <td>${v.name}</td>
      <td>${duration}</td>
      <td>${roundSummary}</td>
      <td><span class="badge b-${v.status}">${v.status.replace('_',' ')}</span><br><span class="small">${withWhom}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="topbar">
    <div><b>Status Overview</b> — ${currentUser.name} (${currentUser.role})</div>
    <button class="secondary" data-action="backToDashboard">Back to Queue</button>
  </div>
  <div style="background:#fff;padding:16px;border-radius:8px">
    <div class="filter-row">
      <div>
        <label class="small">Application</label>
        <select id="filterApp">
          <option value="">All</option>
          ${apps.map(a => `<option value="${a}" ${statusFilters.app===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="small">Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          ${statuses.map(s => `<option value="${s}" ${statusFilters.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="small">Video Name Search</label>
        <input type="text" id="filterVideo" value="${statusFilters.videoSearch}" placeholder="Search video name...">
      </div>
      <div style="flex:0 0 auto;align-self:flex-end">
        <button class="secondary" data-action="clearStatusFilters">Clear Filters</button>
      </div>
    </div>
    <table>
      <thead><tr><th>Application</th><th>Video</th><th>Duration</th><th>Issues Logged vs Fixed (by round)</th><th>Current Status</th></tr></thead>
      <tbody>${rows || '<tr><td colspan=5>No matching videos.</td></tr>'}</tbody>
    </table>
  </div>`;

  document.getElementById('filterApp').addEventListener('change', (e) => { statusFilters.app = e.target.value; screens.statusDashboard(); });
  document.getElementById('filterStatus').addEventListener('change', (e) => { statusFilters.status = e.target.value; screens.statusDashboard(); });
  document.getElementById('filterVideo').addEventListener('input', (e) => { statusFilters.videoSearch = e.target.value; screens.statusDashboard(); });
};

function getAction(v) {
  const role = currentUser.role;
  const mine = v.lock && v.lock.by === currentUser.name && v.lock.role === role;
  switch (v.status) {
    case 'pending_review':
      return role === 'reviewer' ? { label: 'Start Review', action: 'startReview' } : { label: 'Waiting for Reviewer', disabled: true };
    case 'in_review':
      if (role === 'reviewer' && mine) return { label: 'Continue Review', action: 'openReview' };
      return { label: 'Locked by Reviewer', disabled: true };
    case 'reviewed':
      return role === 'developer' ? { label: 'Start Fix', action: 'startFix' } : { label: 'Waiting for Developer', disabled: true };
    case 'in_fix':
      if (role === 'developer' && mine) return { label: 'Continue Fix', action: 'openFix' };
      return { label: 'Locked by Developer', disabled: true };
    case 'fixed':
      return role === 'reviewer' ? { label: `Start Validation R${v.round + 1}`, action: 'startValidation' } : { label: 'Waiting for Reviewer', disabled: true };
    case 'in_validation':
      if (role === 'reviewer' && mine) return { label: 'Continue Validation', action: 'openReview' };
      return { label: 'Locked by Reviewer (validating)', disabled: true };
    case 'signed_off':
      return { label: role === 'reviewer' ? 'View / Rollback' : 'Signed Off (view only)', action: 'openSignedOff' };
  }
}

/* =========================================================
   REVIEW SCREEN — rebuilt as STATIC SHELL + DYNAMIC PANEL
   The <video> element is created ONCE per screen-entry.
   All comment actions update only #commentsPanel afterwards,
   so the video position/src is never disturbed.
   ========================================================= */
screens.review = function () {
  const v = findVideo(activeVideoId);
  const validation = v.status === 'in_validation';
  document.getElementById('app').innerHTML = `
  <div class="topbar">
    <div><b>${v.name}</b> — Round ${v.round} ${validation ? '(Validation)' : '(Review)'}</div>
    <button class="secondary" data-action="backToDashboard">Back to Queue</button>
  </div>
  <div class="layout">
    <div class="video-col">
      <div class="flexgap" style="margin-bottom:8px">
        <button data-action="browseVideo">Browse Video File</button>
        <button class="warn" data-action="autoScanUrls">Auto Review for URLs</button>
        ${validation ? `<button class="success" data-action="markAllFixed">Mark All as Fixed/Approved</button>` : ''}
        <button class="success" data-action="reviewComplete">Review Complete</button>
      </div>
      <video id="reviewVideo" controls></video>
      <div id="scanProgress" class="small"></div>
      <div id="obsArea"></div>
    </div>
    <div class="comments-col" id="commentsPanel"></div>
  </div>`;
  attachVideoHandlers();
  renderCommentsPanel();
};

function renderCommentsPanel() {
  const panel = document.getElementById('commentsPanel');
  if (!panel) return;
  const v = findVideo(activeVideoId);
  const validation = v.status === 'in_validation';
  const roundComments = v.comments;

  // preserve any text the user was mid-typing before this panel refresh
  const existingTa = document.getElementById('commentText');
  const preservedText = existingTa ? existingTa.value : '';
  const micOn = !!recognition;

  panel.innerHTML = `
    <div class="entry-box">
      <textarea id="commentText" rows="2" placeholder="Type a comment..." data-action-focus="pause">${preservedText}</textarea>
      <button id="micBtn" data-action="toggleMic">${micOn ? '⏹' : '🎤'}</button>
      <button class="success" data-action="submitComment">Add</button>
    </div>
    <h3>Comments (${roundComments.length}) ${validation ? `<button class="secondary" data-action="prevComment">◀ Prev</button><button class="secondary" data-action="nextComment">Next ▶</button>` : ''}</h3>
    ${roundComments.map((c) => renderCommentCard(c, validation)).join('') || '<p class="small">No comments yet.</p>'}
  `;

  const ta = document.getElementById('commentText');
  const video = document.getElementById('reviewVideo');
  ta.addEventListener('focus', () => { if (video && !video.paused) video.pause(); });
}

function renderCommentCard(c, validation) {
  return `<div class="comment-card" id="cmt_${c.id}">
    <div class="meta">⏱ <a href="#" data-action="seekTo" data-id="${c.id}">${fmtTime(c.time)}</a> | Round ${c.round} | ${c.source} | ${c.type}</div>
    <img src="${c.screenshot}">
    <div>${c.text}</div>
    <div class="meta">By ${c.loggedBy} on ${c.loggedAt}</div>
    ${c.devStatus ? `<div class="small">Dev marked: <b>${c.devStatus}</b> ${c.devNote ? '- ' + c.devNote : ''}</div>` : ''}
    ${validation ? `
      <div class="flexgap" style="margin-top:6px">
        <button class="success" data-action="approveFix" data-id="${c.id}" ${c.fixStatus==='approved'?'disabled':''}>Approve Fix</button>
        <button class="warn" data-action="followup" data-id="${c.id}">Add Follow-up</button>
      </div>
      ${c.fixStatus ? `<div class="small">Fix Status: <b>${c.fixStatus}</b> ${c.followupText ? '- ' + c.followupText : ''}</div>` : ''}
    ` : `
      <div class="flexgap" style="margin-top:6px">
        <button class="secondary" data-action="deleteComment" data-id="${c.id}">Delete</button>
      </div>
    `}
  </div>`;
}

function attachVideoHandlers() {
  const video = document.getElementById('reviewVideo');
  if (!video) return;
  const v = findVideo(activeVideoId);
  if (v) {
    const key = cacheKey(v);
    if (!video.hasAttribute('src') && videoSrcCache[key]) {
      video.src = videoSrcCache[key];
    }
    video.addEventListener('loadedmetadata', () => {
      if (!v.durationSec) { v.durationSec = video.duration; saveState(); }
      const t = videoTimeCache[key];
      if (t) video.currentTime = t;
    });
    video.addEventListener('timeupdate', () => { videoTimeCache[key] = video.currentTime; });
  }
}

/* =========================================================
   FIX SCREEN — same static-shell pattern for the developer
   ========================================================= */
screens.fix = function () {
  const v = findVideo(activeVideoId);
  document.getElementById('app').innerHTML = `
  <div class="topbar">
    <div><b>${v.name}</b> — Round ${v.round} (Fixing)</div>
    <button class="secondary" data-action="backToDashboard">Back to Queue</button>
  </div>
  <div class="layout">
    <div class="video-col">
      <div class="flexgap" style="margin-bottom:8px"><button data-action="browseVideo">Browse Video File</button></div>
      <video id="reviewVideo" controls></video>
    </div>
    <div class="comments-col" id="fixPanel"></div>
  </div>`;
  attachVideoHandlers();
  renderFixPanel();
};

function renderFixPanel() {
  const panel = document.getElementById('fixPanel');
  if (!panel) return;
  const v = findVideo(activeVideoId);
  panel.innerHTML = `
    <h3>Comments to Address</h3>
    ${v.comments.map(c => `
      <div class="comment-card">
        <div class="meta">⏱ <a href="#" data-action="seekTo" data-id="${c.id}">${fmtTime(c.time)}</a> | Round ${c.round}</div>
        <img src="${c.screenshot}">
        <div>${c.text}</div>
        <div class="meta">By ${c.loggedBy} on ${c.loggedAt}</div>
        ${c.fixStatus === 'followup' ? `<div class="small" style="color:#b45309">Follow-up: ${c.followupText}</div>` : ''}
        <div class="flexgap" style="margin-top:6px">
          <button class="success" data-action="markAddressed" data-id="${c.id}" ${c.devStatus==='addressed'?'disabled':''}>Mark Addressed</button>
          <button class="danger" data-action="markNotAddressed" data-id="${c.id}" ${c.devStatus==='not-addressed'?'disabled':''}>Can't Fix</button>
        </div>
        ${c.devStatus ? `<div class="small">Status: <b>${c.devStatus}</b></div>` : ''}
      </div>`).join('')}
    <button class="success" style="width:100%;margin-top:10px" data-action="allFixesComplete">All Fixes Completed</button>
  `;
}

screens.signedoff = function () {
  const v = findVideo(activeVideoId);
  document.getElementById('app').innerHTML = `
  <div class="topbar"><div><b>${v.name}</b> — Signed Off</div>
  <button class="secondary" data-action="backToDashboard">Back to Queue</button></div>
  <div style="background:#fff;padding:16px;border-radius:8px">
    <h3>All comments resolved and approved. Video is signed off.</h3>
    ${v.comments.map(c => `<div class="comment-card"><div>${fmtTime(c.time)} — ${c.text}</div><div class="small">Fix: ${c.fixStatus}</div></div>`).join('')}
    ${currentUser.role === 'reviewer' ? `<button class="danger" data-action="rollback">Rollback to Fix Stage</button>` : ''}
  </div>`;
};

/* ============== ACTIONS ============== */
const actions = {
  pickRole(el, id) { currentUser.role = id; screens.init(); },
  async createDataFile() { await pickFile(true); screens.init(); },
  async openDataFile() { await pickFile(false); screens.init(); },
  enterApp() {
    const name = currentUser.name.trim();
    if (!name) { alert('Name is required'); return; }
    currentUser.name = name;
    screen = 'dashboard';
    render();
  },
  logout() { currentUser = { name:'', role:'' }; screen = 'init'; render(); },
  refreshNow: async () => { await loadState(); render(); },
  openStatusDashboard() { screen = 'statusDashboard'; render(); },
  clearStatusFilters() { statusFilters = { app:'', status:'', videoSearch:'' }; render(); },
  exportCsv() {
    let rows = [['Video','Round','Timestamp','Comment','Source','LoggedBy','LoggedAt','DevStatus','FixStatus']];
    state.videos.forEach(v => v.comments.forEach(c => {
      rows.push([v.name, c.round, fmtTime(c.time), c.text.replace(/\n/g,' '), c.source, c.loggedBy, c.loggedAt, c.devStatus||'', c.fixStatus||'']);
    }));
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'review-log.csv'; a.click();
  },
  openAddVideo() {
    document.getElementById('app').insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="modal"><div class="modal">
      <h3>Add New Video Entry</h3>
      <label>Application Name</label>
      <input type="text" id="newAppName" placeholder="Application name">
      <label style="margin-top:8px;display:block">Video Name</label>
      <input type="text" id="newVideoName" placeholder="Video name / description">
      <div class="flexgap" style="margin-top:12px"><button data-action="saveNewVideo">Save</button><button class="secondary" data-action="closeModal">Cancel</button></div>
    </div></div>`);
  },
  closeModal() { document.getElementById('modal')?.remove(); },
  async saveNewVideo() {
    const appName = document.getElementById('newAppName').value.trim();
    const name = document.getElementById('newVideoName').value.trim();
    if (!name) return;
    await loadState();
    state.videos.push({ id: uid(), appName, name, status:'pending_review', round:1, lock:null, addedBy: currentUser.name, addedAt: nowStr(), comments:[], durationSec:null });
    await saveState();
    actions.closeModal();
    render();
  },
  async startReview(el, id) {
    await loadState();
    const v = findVideo(id);
    if (v.lock && v.lock.role && !(v.lock.by === currentUser.name && v.lock.role === 'reviewer')) { toast('Locked by someone else'); render(); return; }
    v.status = 'in_review';
    v.lock = { role:'reviewer', by: currentUser.name, at: nowStr() };
    await saveState();
    activeVideoId = id; screen = 'review'; render();
  },
  openReview(el, id) { activeVideoId = id; screen = 'review'; render(); },
  async startFix(el, id) {
    await loadState();
    const v = findVideo(id);
    if (v.lock && v.lock.role && !(v.lock.by === currentUser.name && v.lock.role === 'developer')) { toast('Locked by someone else'); render(); return; }
    v.status = 'in_fix';
    v.lock = { role:'developer', by: currentUser.name, at: nowStr() };
    await saveState();
    activeVideoId = id; screen = 'fix'; render();
  },
  openFix(el, id) { activeVideoId = id; screen = 'fix'; render(); },
  async startValidation(el, id) {
    await loadState();
    const v = findVideo(id);
    if (v.lock && v.lock.role && !(v.lock.by === currentUser.name && v.lock.role === 'reviewer')) { toast('Locked by someone else'); render(); return; }
    v.status = 'in_validation';
    v.round += 1;
    v.lock = { role:'reviewer', by: currentUser.name, at: nowStr() };
    await saveState();
    activeVideoId = id; screen = 'review'; render();
  },
  openSignedOff(el, id) { activeVideoId = id; screen = 'signedoff'; render(); },
  backToDashboard() { screen = 'dashboard'; render(); },

  browseVideo() {
    const input = document.getElementById('videoFileInput');
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      const video = document.getElementById('reviewVideo');
      const url = URL.createObjectURL(file);
      video.src = url;
      const v = findVideo(activeVideoId);
      if (v) videoSrcCache[cacheKey(v)] = url;
    };
    input.click();
  },

  toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Speech recognition not supported in this browser'); return; }
    const btn = document.getElementById('micBtn');
    if (recognition) { recognition.stop(); recognition = null; btn.textContent = '🎤'; return; }
    const video = document.getElementById('reviewVideo');
    if (video && !video.paused) video.pause();
    recognition = new SR();
    recognition.continuous = true; recognition.interimResults = false;
    recognition.onresult = (e) => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript + ' ';
      const ta = document.getElementById('commentText');
      if (ta) ta.value += text;
    };
    recognition.onend = () => { const b = document.getElementById('micBtn'); if (b) b.textContent = '🎤'; recognition = null; };
    recognition.start();
    btn.textContent = '⏹';
  },

  async submitComment() {
    const video = document.getElementById('reviewVideo');
    const text = document.getElementById('commentText').value.trim();
    if (!text) { toast('Enter a comment'); return; }
    if (!video.src) { toast('Browse a video first'); return; }
    const v = findVideo(activeVideoId);
    const currentTimeAtSubmit = video.currentTime; // captured BEFORE any DOM changes
    const canvas = document.createElement('canvas');
    canvas.width = Math.min(video.videoWidth, 480);
    canvas.height = canvas.width * (video.videoHeight / video.videoWidth);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    v.comments.push({
      id: uid(), time: currentTimeAtSubmit, screenshot: canvas.toDataURL('image/jpeg', 0.6),
      text, type: recognition ? 'voice' : 'text', source:'manual',
      loggedBy: currentUser.name, loggedAt: nowStr(), round: v.round,
      devStatus: null, devNote:'', fixStatus: null, followupText:''
    });
    await saveState();
    renderCommentsPanel(); // video element untouched — no jump, no reset
  },

  seekTo(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    const video = document.getElementById('reviewVideo');
    if (video && c) video.currentTime = c.time;
  },

  async deleteComment(el, id) {
    const v = findVideo(activeVideoId);
    v.comments = v.comments.filter(c => c.id !== id);
    await saveState();
    renderCommentsPanel();
  },

  async reviewComplete() {
    const v = findVideo(activeVideoId);
    if (v.status === 'in_review') {
      v.status = 'reviewed'; v.lock = null;
      await saveState();
      toast('Review submitted. Locked released for developer.');
    } else if (v.status === 'in_validation') {
      const open = v.comments.filter(c => c.fixStatus !== 'approved');
      if (open.length === 0) { v.status = 'signed_off'; v.lock = { role:'locked', by:'system', at: nowStr() }; toast('All fixes approved — Video Signed Off!'); }
      else { v.status = 'reviewed'; v.lock = null; toast('Some items still open — sent back to developer.'); }
      await saveState();
    }
    screen = 'dashboard'; render();
  },

  async markAddressed(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    c.devStatus = 'addressed';
    await saveState();
    renderFixPanel();
  },
  async markNotAddressed(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    c.devStatus = 'not-addressed';
    c.devNote = prompt('Reason / note:', c.devNote || '') || '';
    await saveState();
    renderFixPanel();
  },
  async allFixesComplete() {
    const v = findVideo(activeVideoId);
    const pending = v.comments.filter(c => !c.devStatus);
    if (pending.length) { toast('Please mark all comments before completing.'); return; }
    const confirmUpload = confirm('Confirm: Have you uploaded the latest MP4 file to SharePoint?');
    if (confirmUpload) {
      v.status = 'fixed'; v.lock = null;
      await saveState();
      toast('Marked fixed and uploaded. Sent to reviewer.');
      screen = 'dashboard'; render();
    }
  },

  async approveFix(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    c.fixStatus = 'approved';
    await saveState();
    renderCommentsPanel();
  },
  async followup(el, id) {
    const v = findVideo(activeVideoId);
    const c = v.comments.find(x => x.id === id);
    const txt = prompt('Follow-up note:');
    if (txt) { c.fixStatus = 'followup'; c.followupText = txt; c.devStatus = null; }
    await saveState();
    renderCommentsPanel();
  },
  async markAllFixed() {
    const v = findVideo(activeVideoId);
    v.comments.forEach(c => { if (c.devStatus === 'addressed') c.fixStatus = 'approved'; });
    await saveState();
    renderCommentsPanel();
  },
  prevComment() {
    const v = findVideo(activeVideoId);
    if (!v.comments.length) return;
    activeCommentIndex = (activeCommentIndex - 1 + v.comments.length) % v.comments.length;
    const c = v.comments[activeCommentIndex];
    document.getElementById('reviewVideo').currentTime = c.time;
    document.getElementById('cmt_' + c.id)?.scrollIntoView({behavior:'smooth'});
  },
  nextComment() {
    const v = findVideo(activeVideoId);
    if (!v.comments.length) return;
    activeCommentIndex = (activeCommentIndex + 1) % v.comments.length;
    const c = v.comments[activeCommentIndex];
    document.getElementById('reviewVideo').currentTime = c.time;
    document.getElementById('cmt_' + c.id)?.scrollIntoView({behavior:'smooth'});
  },

  async rollback() {
    const v = findVideo(activeVideoId);
    v.round += 1;
    v.status = 'fixed'; v.lock = null;
    await saveState();
    toast('Rolled back to Fix stage. New round started: R' + v.round);
    screen = 'dashboard'; render();
  },

  /* ---- Auto URL scan using Tesseract.js ---- */
  async autoScanUrls() {
    const video = document.getElementById('reviewVideo');
    if (!video.src) { toast('Browse a video first'); return; }
    if (!video.duration || isNaN(video.duration)) { toast('Video not ready yet'); return; }
    pendingObservations = [];
    scanAbort = false;
    const progressEl = document.getElementById('scanProgress');
    const duration = video.duration;
    for (let t = 0; t < duration && !scanAbort; t += 5) {
      progressEl.textContent = `Scanning ${fmtTime(t)} / ${fmtTime(duration)}...`;
      await seekVideo(video, t);
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const regions = cornerRegions(canvas);
      for (const r of regions) {
        try {
          const { data: { text } } = await Tesseract.recognize(r.canvas, 'eng');
          const urls = extractUrls(text);
          if (urls.length) {
            pendingObservations.push({ id: uid(), time: t, corner: r.label, text: urls.join(', '), screenshot: canvas.toDataURL('image/jpeg', 0.6) });
          }
        } catch (e) { /* ignore OCR error for this region */ }
      }
      renderObservations();
    }
    progressEl.textContent = `Scan complete. ${pendingObservations.length} observation(s) found.`;
  },

  acceptObs(el, id) {
    const obs = pendingObservations.find(o => o.id === id);
    const v = findVideo(activeVideoId);
    v.comments.push({
      id: uid(), time: obs.time, screenshot: obs.screenshot, text: `URL detected (${obs.corner}): ${obs.text}`,
      type:'text', source:'url-auto', loggedBy: currentUser.name, loggedAt: nowStr(), round: v.round,
      devStatus: null, devNote:'', fixStatus: null, followupText:''
    });
    pendingObservations = pendingObservations.filter(o => o.id !== id);
    saveState().then(() => { renderObservations(); renderCommentsPanel(); });
  },
  rejectObs(el, id) {
    pendingObservations = pendingObservations.filter(o => o.id !== id);
    renderObservations();
  }
};

function seekVideo(video, t) {
  return new Promise(res => {
    const onSeek = () => { video.removeEventListener('seeked', onSeek); res(); };
    video.addEventListener('seeked', onSeek);
    video.currentTime = t;
  });
}
function cornerRegions(canvas) {
  const w = canvas.width, h = canvas.height;
  const cw = Math.floor(w * 0.28), ch = Math.floor(h * 0.28);
  const coords = [['TopLeft',0,0], ['TopRight', w - cw, 0], ['BottomLeft', 0, h - ch], ['BottomRight', w - cw, h - ch]];
  return coords.map(([label, x, y]) => {
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    c.getContext('2d').drawImage(canvas, x, y, cw, ch, 0, 0, cw, ch);
    return { label, canvas: c };
  });
}
function extractUrls(text) {
  const re = /((https?:\/\/|www\.)[^\s]+|[a-zA-Z0-9-]+\.(com|org|net|io|gov|edu)[^\s]*)/gi;
  return text.match(re) || [];
}
function renderObservations() {
  const area = document.getElementById('obsArea');
  if (!area) return;
  area.innerHTML = pendingObservations.map(o => `
    <div class="obs-card">
      <div class="meta">⏱ ${fmtTime(o.time)} — ${o.corner}</div>
      <div><b>${o.text}</b></div>
      <img src="${o.screenshot}" style="width:150px;border-radius:4px">
      <div class="flexgap"><button class="success" data-action="acceptObs" data-id="${o.id}">Accept</button><button class="danger" data-action="rejectObs" data-id="${o.id}">Reject</button></div>
    </div>`).join('');
}

/* ============== EVENT DELEGATION ============== */
document.getElementById('app').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const fn = actions[el.dataset.action];
  if (fn) fn(el, el.dataset.id, e);
});

/* ============== INIT ============== */
render();
</script>
